name: Deploy Devlog to FTP

on:
  workflow_dispatch:
    inputs:
      force_all:
        description:  Force all
        default: true
        type: boolean
  push:
    branches:
      - main

env:
  LFTP_PARAMS: ${{ github.event.inputs.force_all && '--transfer-all' || '--only-newer --ignore-time' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: gerlero/apt-install@v1
        with:
          packages: lftp

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.152.2'

      - name: Build
        run: hugo --minify

      - name: FTP Deploy
        run: lftp -e "open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER; mirror -R --verbose --delete --overwrite $LFTP_PARAMS --parallel=10 public/ /www/devlog; quit"
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
